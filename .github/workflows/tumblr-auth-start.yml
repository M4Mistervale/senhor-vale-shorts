name: Iniciar autorização do Tumblr

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  authorization-link:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Gerar link oficial de autorização
        env:
          TUMBLR_CONSUMER_KEY: ${{ secrets.TUMBLR_CONSUMER_KEY }}
          TUMBLR_CONSUMER_SECRET: ${{ secrets.TUMBLR_CONSUMER_SECRET }}
        run: node automation/tumblr-auth-start.mjs
